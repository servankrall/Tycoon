# BLOCK CITY TYCOON — builds the Windows installer + portable EXE on a real Windows runner and publishes a GitHub Release.
# Runs automatically on every push to the game branch (tag = "v" + package.json version, e.g. v1.0.0),
# and can also be started by hand: Actions → "Windows Release" → Run workflow.
name: Windows Release

on:
  push:
    branches: [claude/happy-mayer-nu7z1c]
    paths:
      - "src/**"
      - "electron/**"
      - "build/**"
      - "scripts/**"
      - "main.js"
      - "preload.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-release.yml"
      - ".github/RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no code-signing certificate configured
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install
        run: npm ci

      - name: Build installer + portable EXE
        run: npm run dist

      - name: Self-test the built EXE (30 steps, including a restart)
        shell: pwsh
        timeout-minutes: 12
        run: |
          $exe = Get-ChildItem dist/win-unpacked -Filter *.exe | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "win-unpacked EXE not found" }
          $out = Join-Path $env:GITHUB_WORKSPACE "dist/selftest-report.json"
          Write-Host "Running $($exe.FullName) --selftest"
          Start-Process -FilePath $exe.FullName -ArgumentList "--selftest", "--selftest-out=$out"
          $deadline = (Get-Date).AddMinutes(10)
          while (-not (Test-Path $out) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (-not (Test-Path $out)) { throw "The self-test did not finish within 10 minutes" }
          Start-Sleep -Seconds 2
          $r = Get-Content $out -Raw | ConvertFrom-Json
          $r.steps | ForEach-Object { Write-Host ("{0} {1,2}. {2} — {3}" -f ($(if ($_.ok) { 'PASS' } else { 'FAIL' })), $_.n, $_.name, $_.detail) }
          Write-Host ("Self-test: {0}/{1} passed in {2} s" -f $r.passed, $r.total, $r.seconds)
          if (-not $r.ok) { throw "Self-test failed" }

      - name: Keep the EXEs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOCK-CITY-TYCOON-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/BLOCK-CITY-TYCOON-Setup-*.exe
            dist/BLOCK-CITY-TYCOON-Portable-*.exe
            dist/selftest-report.json
          if-no-files-found: error

      - name: Release notes with SHA-256 checksums
        shell: pwsh
        run: |
          $notes = Get-Content .github/RELEASE_NOTES.md -Raw
          $sums = Get-ChildItem dist/*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $notes = $notes + "`n## SHA-256`n``````n" + ($sums -join "`n") + "`n``````n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BLOCK CITY TYCOON ${{ steps.ver.outputs.tag }} — Windows
          body_path: release-notes.md
          make_latest: true
          files: |
            dist/BLOCK-CITY-TYCOON-Setup-*.exe
            dist/BLOCK-CITY-TYCOON-Portable-*.exe
            dist/selftest-report.json
