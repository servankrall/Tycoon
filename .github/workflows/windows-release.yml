# BLOCK CITY TYCOON — builds the Windows installer + portable EXE on a real Windows runner and publishes a GitHub Release.
# Run it from GitHub: Actions → "Windows Release" → Run workflow (choose the version tag, e.g. v1.0.0).
name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match package.json version, e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no code-signing certificate configured
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.event.inputs.tag }}") { Write-Error "Tag ${{ github.event.inputs.tag }} does not match package.json version v$v"; exit 1 }

      - name: Install
        run: npm ci

      - name: Build installer + portable EXE
        run: npm run dist

      - name: Release notes with SHA-256 checksums
        shell: pwsh
        run: |
          $notes = Get-Content .github/RELEASE_NOTES.md -Raw
          $sums = Get-ChildItem dist/*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $notes = $notes + "`n## SHA-256`n``````n" + ($sums -join "`n") + "`n``````n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BLOCK CITY TYCOON ${{ github.event.inputs.tag }} — Windows
          body_path: release-notes.md
          files: |
            dist/BLOCK-CITY-TYCOON-Setup-*.exe
            dist/BLOCK-CITY-TYCOON-Portable-*.exe
