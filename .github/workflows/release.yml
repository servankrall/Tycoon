# BLOCK CITY TYCOON — release pipeline for every platform. Runs on every push to the game branch (tag = "v" + package.json
# version) and by hand (Actions → "Release (Windows + Android)" → Run workflow).
#   windows : Setup + Portable EXE (dist/windows) → automatic self-test of the built EXE (restart included)
#   android : debug + signed release APK (dist/android) → automatic self-test of the release APK on an Android emulator
#   release : one GitHub Release with the EXEs, APKs, both self-test reports and SHA-256 checksums
name: Release (Windows + Android)

on:
  push:
    branches: [claude/happy-mayer-nu7z1c]
    paths:
      - "src/**"
      - "electron/**"
      - "android/**"
      - "build/**"
      - "scripts/**"
      - "main.js"
      - "preload.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
      - ".github/RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no code-signing certificate configured
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build installer + portable EXE (RELEASE profile → dist/windows)
        run: npm run build:windows
      - name: Self-test the built EXE (Windows, including a restart)
        shell: pwsh
        timeout-minutes: 14
        run: |
          $exe = Get-ChildItem dist/windows/win-unpacked -Filter *.exe | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "win-unpacked EXE not found" }
          $out = Join-Path $env:GITHUB_WORKSPACE "dist/windows/selftest-report-windows.json"
          Write-Host "Running $($exe.FullName) --selftest"
          Start-Process -FilePath $exe.FullName -ArgumentList "--selftest", "--selftest-out=$out"
          $deadline = (Get-Date).AddMinutes(12)
          while (-not (Test-Path $out) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (-not (Test-Path $out)) { throw "The self-test did not finish within 12 minutes" }
          Start-Sleep -Seconds 2
          $r = Get-Content $out -Raw | ConvertFrom-Json
          $r.steps | ForEach-Object { Write-Host ("{0} {1,2}. {2} — {3}" -f ($(if ($_.ok) { 'PASS' } else { 'FAIL' })), $_.n, $_.name, $_.detail) }
          Write-Host ("Self-test: {0}/{1} passed in {2} s" -f $r.passed, $r.total, $r.seconds)
          if (-not $r.ok) { throw "Self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/BLOCK-CITY-TYCOON-Setup-*.exe
            dist/windows/BLOCK-CITY-TYCOON-Portable-*.exe
            dist/windows/selftest-report-windows.json
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug + signed release APK (RELEASE profile → dist/android)
        run: node scripts/build.js android
      - name: Verify APK signatures
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in dist/android/*.apk; do echo "== $f"; $BT/apksigner verify --print-certs "$f" | head -4; $BT/aapt dump badging "$f" | head -3; done
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Self-test the release APK on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-selftest.sh dist/android/BLOCK-CITY-TYCOON-Android-Release.apk dist/android/selftest-report-android.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: |
            dist/android/BLOCK-CITY-TYCOON-Android.apk
            dist/android/BLOCK-CITY-TYCOON-Android-Release.apk
            dist/android/selftest-report-android.json
            dist/android/android-screenshot.png
            dist/android/logcat.txt
          if-no-files-found: warn

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          echo "tag=v$v" >> $GITHUB_OUTPUT
          echo "version=$v" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release notes with SHA-256 checksums
        run: |
          cp .github/RELEASE_NOTES.md release-notes.md
          { echo; echo "## SHA-256"; echo '```'; (cd dist && sha256sum windows/*.exe android/*.apk | sed 's#[a-z]*/##'); echo '```'; } >> release-notes.md
          cat release-notes.md | tail -8
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BLOCK CITY TYCOON ${{ steps.ver.outputs.tag }} — Windows + Android
          body_path: release-notes.md
          make_latest: true
          files: |
            dist/windows/BLOCK-CITY-TYCOON-Setup-*.exe
            dist/windows/BLOCK-CITY-TYCOON-Portable-*.exe
            dist/windows/selftest-report-windows.json
            dist/android/BLOCK-CITY-TYCOON-Android.apk
            dist/android/BLOCK-CITY-TYCOON-Android-Release.apk
            dist/android/selftest-report-android.json
