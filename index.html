<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12152b">
<title>Block City Tycoon — PRO Edition</title>
<style>
/* =====================================================================
   BLOCK CITY TYCOON — PRO EDITION
   Single-file HTML5 city management simulator.
   Section 1: THEME TOKENS & BASE
   ===================================================================== */
:root{
  --bg:#0f1226;
  --bg2:#161a36;
  --panel:rgba(27,31,64,.94);
  --panel-solid:#1b1f40;
  --panel2:#252a57;
  --panel3:#313772;
  --line:rgba(140,150,255,.18);
  --text:#eef0ff;
  --dim:#a3a9d6;
  --mute:#6f76a8;
  --gold:#ffd166;
  --green:#06d6a0;
  --red:#ef476f;
  --blue:#4cc9f0;
  --purple:#9b5de5;
  --orange:#f8961e;
  --radius:14px;
  --top-h:56px;
  --nav-w:74px;
  --panel-w:380px;
  --right-w:310px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Trebuchet MS',sans-serif;
  color:var(--text);font-size:14px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  touch-action:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;outline:none;background:none;}
input,select{font-family:inherit;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* Section 2: GAME CANVAS ------------------------------------------------ */
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0b0e1f;touch-action:none;}

/* Section 3: TOP BAR ---------------------------------------------------- */
#topbar{
  position:fixed;left:0;right:0;top:0;height:var(--top-h);z-index:20;
  display:flex;align-items:center;gap:8px;padding:0 10px;padding-top:env(safe-area-inset-top,0);
  background:linear-gradient(180deg,rgba(22,26,56,.98),rgba(22,26,56,.9));
  border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.35);
}
#logo{font-weight:900;font-size:15px;letter-spacing:.5px;color:var(--gold);white-space:nowrap;margin-right:4px;line-height:1;}
#logo small{display:block;font-size:9px;color:var(--green);letter-spacing:2px;}
.stat{
  display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);font-weight:700;white-space:nowrap;min-width:0;
}
.stat .lbl{font-size:10px;color:var(--dim);font-weight:600;display:block;line-height:1;}
.stat .val{font-size:14px;line-height:1.1;}
.stat.money .val{color:var(--gold);}
.stat.income .val{font-size:12px;}
.pos{color:var(--green);} .neg{color:var(--red);}
#topRight{margin-left:auto;display:flex;align-items:center;gap:6px;}
#clockBox{text-align:right;line-height:1.05;}
#clockBox .t{font-weight:800;font-size:15px;}
#clockBox .d{font-size:10px;color:var(--dim);}
.speedBtns{display:flex;background:var(--panel2);border-radius:10px;border:1px solid var(--line);overflow:hidden;}
.speedBtns button{padding:7px 9px;font-size:12px;font-weight:800;color:var(--dim);}
.speedBtns button.on{background:var(--blue);color:#081020;}
.iconBtn{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:17px;display:flex;align-items:center;justify-content:center;}
.iconBtn:active{transform:scale(.94);}

/* Section 4: LEFT NAV + DRAWER ------------------------------------------ */
#leftnav{
  position:fixed;left:0;top:var(--top-h);bottom:0;width:var(--nav-w);z-index:18;
  display:flex;flex-direction:column;gap:6px;padding:10px 7px;
  background:rgba(20,24,52,.95);border-right:1px solid var(--line);
}
.navbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:60px;border-radius:12px;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.3px;
  border:1px solid transparent;transition:background .15s,color .15s,transform .1s;
}
.navbtn .ic{font-size:22px;line-height:1;}
.navbtn:hover{background:var(--panel2);color:var(--text);}
.navbtn.on{background:var(--panel3);color:var(--gold);border-color:rgba(255,209,102,.35);}
.navbtn:active{transform:scale(.95);}
.navsep{flex:1;}

#leftPanel{
  position:fixed;left:var(--nav-w);top:var(--top-h);bottom:0;width:var(--panel-w);z-index:17;
  background:var(--panel);backdrop-filter:blur(8px);border-right:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:var(--shadow);
  transform:translateX(-110%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
#leftPanel.open{transform:translateX(0);}
.panelHead{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;}
.panelHead h2{font-size:17px;font-weight:800;flex:1;}
.closeX{width:32px;height:32px;border-radius:9px;background:var(--panel2);font-size:15px;color:var(--dim);}
.tabs{display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto;flex-shrink:0;}
.tab{padding:7px 11px;border-radius:9px;background:var(--panel2);color:var(--dim);font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent;}
.tab.on{background:var(--panel3);color:var(--text);border-color:var(--line);}
.panelBody{flex:1;overflow-y:auto;padding:4px 12px 16px;touch-action:pan-y;}

/* Section 5: RIGHT PANEL ------------------------------------------------ */
#rightPanel{
  position:fixed;right:0;top:var(--top-h);bottom:0;width:var(--right-w);z-index:16;
  background:var(--panel);backdrop-filter:blur(8px);border-left:1px solid var(--line);
  display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
#rightPanel.collapsed{transform:translateX(100%);}
#rightToggle{
  position:fixed;top:calc(var(--top-h) + 10px);right:calc(var(--right-w) + 8px);z-index:16;
  transition:right .25s cubic-bezier(.2,.8,.2,1);
}
body.rightCollapsed #rightToggle{right:10px;}
#advisor{margin:10px 10px 4px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,#2d3a7a,#26305f);border:1px solid rgba(76,201,240,.35);display:none;}
#advisor.show{display:block;animation:pop .3s ease;}
#advisor .ah{font-size:10px;font-weight:800;color:var(--blue);letter-spacing:1px;}
#advisor .am{font-size:13px;margin:4px 0 8px;line-height:1.3;}
#advisor .row{display:flex;gap:6px;}

/* Section 6: BOTTOM INFO + TOOLBAR -------------------------------------- */
#bottomInfo{
  position:fixed;left:calc(var(--nav-w) + 12px);right:calc(var(--right-w) + 12px);bottom:12px;z-index:15;
  background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:12px;align-items:center;
  transform:translateY(140%);transition:transform .25s cubic-bezier(.2,.8,.2,1),left .25s,right .25s;
  max-width:980px;margin:0 auto;
}
body.rightCollapsed #bottomInfo{right:12px;}
body.leftOpen #bottomInfo{left:calc(var(--nav-w) + var(--panel-w) + 12px);}
#bottomInfo.show{transform:translateY(0);}
#biIcon{font-size:34px;width:56px;height:56px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#biMain{flex:1;min-width:0;}
#biTitle{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#biStatus{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;}
#biStats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:12px;color:var(--dim);}
#biStats b{color:var(--text);}
#biActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}

#toolbar{
  position:fixed;left:calc(var(--nav-w) + 12px);top:calc(var(--top-h) + 12px);z-index:14;
  display:flex;flex-direction:column;gap:6px;transition:left .25s cubic-bezier(.2,.8,.2,1);
}
body.leftOpen #toolbar{left:calc(var(--nav-w) + var(--panel-w) + 12px);}
.toolBtn{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3);position:relative;}
.toolBtn.on{background:var(--blue);border-color:var(--blue);}
.toolBtn .tip{position:absolute;left:52px;white-space:nowrap;background:#0b0e1f;padding:4px 8px;border-radius:6px;font-size:11px;opacity:0;pointer-events:none;transition:opacity .15s;}
.toolBtn:hover .tip{opacity:1;}
#overlayLabel{font-size:10px;text-align:center;color:var(--dim);font-weight:700;}

#placeBar{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:19;
  display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);
}
#placeBar .pinfo{font-size:12px;color:var(--dim);max-width:220px;}
#placeBar .pinfo b{color:var(--text);display:block;font-size:13px;}

/* Section 7: BUTTONS, CARDS, WIDGETS ------------------------------------ */
.btn{padding:8px 12px;border-radius:10px;font-weight:800;font-size:12px;background:var(--panel3);color:var(--text);border:1px solid var(--line);transition:transform .08s,filter .15s;white-space:nowrap;}
.btn:hover{filter:brightness(1.15);}
.btn:active{transform:scale(.96);}
.btn.gold{background:linear-gradient(180deg,#ffd166,#e9b340);color:#2a1d00;border-color:#ffe199;}
.btn.green{background:linear-gradient(180deg,#1ee3b1,#06b386);color:#00251b;border-color:#6ff3d0;}
.btn.red{background:linear-gradient(180deg,#ff6b8b,#d8385d);color:#fff;border-color:#ff9db3;}
.btn.blue{background:linear-gradient(180deg,#69d6f5,#2ea8d6);color:#04202c;border-color:#a6e9fb;}
.btn.small{padding:5px 9px;font-size:11px;}
.btn.big{padding:12px 18px;font-size:15px;border-radius:12px;}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none;filter:grayscale(.6);}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;}
.card h3{font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.card p,.small{font-size:12px;color:var(--dim);line-height:1.35;}
.secTitle{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--mute);margin:12px 2px 6px;text-transform:uppercase;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;}
.kpi .k{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.4px;}
.kpi .v{font-size:16px;font-weight:800;margin-top:2px;}
.bar{height:8px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;position:relative;}
.bar i{display:block;height:100%;border-radius:6px;background:var(--green);transition:width .4s;}
.row{display:flex;align-items:center;gap:8px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--panel3);color:var(--dim);}
.tag.g{background:rgba(6,214,160,.18);color:var(--green);}
.tag.r{background:rgba(239,71,111,.18);color:var(--red);}
.tag.y{background:rgba(255,209,102,.18);color:var(--gold);}
.tag.b{background:rgba(76,201,240,.18);color:var(--blue);}
input[type=range]{width:100%;accent-color:var(--gold);height:28px;touch-action:pan-x;}
select{background:var(--panel3);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;}
canvas.chart{width:100%;height:120px;display:block;background:rgba(0,0,0,.2);border-radius:10px;}

/* Build cards */
.buildGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:left;position:relative;transition:transform .1s,border-color .15s;display:flex;flex-direction:column;gap:3px;min-height:112px;}
.bcard:hover{border-color:rgba(255,209,102,.45);}
.bcard:active{transform:scale(.97);}
.bcard .bi{font-size:26px;line-height:1;}
.bcard .bn{font-weight:800;font-size:12.5px;}
.bcard .bc{font-weight:800;color:var(--gold);font-size:12px;}
.bcard .bs{font-size:10.5px;color:var(--dim);line-height:1.3;}
.bcard.locked{opacity:.5;}
.bcard.locked .bc{color:var(--mute);}
.bcard.poor .bc{color:var(--red);}
.bcard.highlight{border-color:var(--blue);box-shadow:0 0 0 2px rgba(76,201,240,.5),0 0 18px rgba(76,201,240,.4);animation:pulse 1.2s infinite;}
.bcard .sz{position:absolute;top:8px;right:8px;font-size:9px;color:var(--mute);font-weight:800;}

/* Tech tree */
.techCols{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;touch-action:pan-x pan-y;}
.techCol{min-width:170px;flex:1;}
.techCol h4{font-size:11px;letter-spacing:1px;color:var(--mute);margin:4px 0 8px;text-align:center;}
.tnode{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:4px;position:relative;}
.tnode.done{border-color:rgba(6,214,160,.6);background:rgba(6,214,160,.10);}
.tnode.avail{border-color:rgba(255,209,102,.55);}
.tnode.locked{opacity:.5;}
.tnode .tn{font-weight:800;font-size:12px;}
.tnode .td{font-size:10.5px;color:var(--dim);margin:3px 0 5px;line-height:1.3;}
.tarrow{text-align:center;color:var(--mute);font-size:12px;line-height:1;margin:-1px 0 3px;}

/* Right panel lists */
.qitem{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;}
.qitem.done{opacity:.55;}
.qitem .qt{font-weight:800;font-size:12.5px;}
.qitem .qd{font-size:11.5px;color:var(--dim);margin-top:2px;}
.qitem.story{border-color:rgba(155,93,229,.55);background:linear-gradient(135deg,rgba(155,93,229,.18),rgba(37,42,87,.9));}
.notif{font-size:12px;padding:7px 9px;border-bottom:1px solid var(--line);display:flex;gap:8px;}
.notif .nt{color:var(--mute);font-size:10px;white-space:nowrap;margin-top:2px;}
.eventItem{background:var(--panel2);border-radius:10px;padding:8px 10px;margin-bottom:6px;border-left:4px solid var(--orange);}
.eventItem.good{border-left-color:var(--green);}
.eventItem.bad{border-left-color:var(--red);}

/* Section 8: MODALS, TOASTS, OVERLAYS ---------------------------------- */
#modalWrap{position:fixed;inset:0;z-index:60;background:rgba(5,7,18,.6);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);}
#modalWrap.show{display:flex;}
#modal{background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pop .22s ease;}
#modalHead{display:flex;align-items:center;padding:14px 16px 8px;gap:8px;}
#modalHead h2{flex:1;font-size:18px;}
#modalBody{overflow-y:auto;padding:4px 16px 16px;touch-action:pan-y;}
#toasts{position:fixed;top:calc(var(--top-h) + 10px);left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px);}
.toast{background:rgba(20,24,52,.97);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);animation:toastIn .3s ease;text-align:center;}
.toast.good{border-color:rgba(6,214,160,.6);}
.toast.bad{border-color:rgba(239,71,111,.7);}
.toast.gold{border-color:rgba(255,209,102,.7);color:var(--gold);}
.toast.out{animation:toastOut .3s ease forwards;}
#fpsBox,#debugBox{position:fixed;z-index:30;font:11px/1.35 ui-monospace,Consolas,monospace;background:rgba(0,0,0,.72);color:#9ff;padding:6px 9px;border-radius:8px;pointer-events:none;white-space:pre;}
#fpsBox{right:calc(var(--right-w) + 60px);top:calc(var(--top-h) + 10px);}
body.rightCollapsed #fpsBox{right:60px;}
#debugBox{right:calc(var(--right-w) + 12px);bottom:110px;color:#ff9;}
.navbtn.mobileOnly{display:none;}
#tutorial{position:fixed;z-index:65;max-width:340px;background:linear-gradient(135deg,#2b3574,#1f2553);border:1px solid rgba(255,209,102,.5);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);animation:pop .25s ease;}
#tutorial h3{color:var(--gold);font-size:15px;margin-bottom:6px;}
#tutorial p{font-size:13px;line-height:1.4;color:var(--text);}
#tutorial .row{margin-top:10px;justify-content:flex-end;}
.tutHL{position:relative;z-index:64 !important;box-shadow:0 0 0 3px var(--gold),0 0 24px rgba(255,209,102,.6) !important;border-radius:12px;animation:pulse 1.2s infinite;}
#levelFlash{position:fixed;inset:0;z-index:55;pointer-events:none;display:flex;align-items:center;justify-content:center;}
#levelFlash div{font-size:34px;font-weight:900;color:var(--gold);text-shadow:0 0 24px rgba(255,209,102,.8),0 4px 0 #6b4a00;animation:bigPop 1.8s ease forwards;text-align:center;}

/* Loading / title screen */
#titleScreen{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 30%,#2a3170 0%,#12152b 60%,#080a17 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;padding:20px;text-align:center;}
#titleScreen.fade{opacity:0;pointer-events:none;}
#titleLogo{font-size:clamp(34px,8vw,64px);font-weight:900;line-height:.95;letter-spacing:1px;color:var(--gold);text-shadow:0 0 30px rgba(255,209,102,.45),0 6px 0 #5c3f00;}
#titleLogo span{display:block;color:var(--green);text-shadow:0 0 30px rgba(6,214,160,.45),0 6px 0 #024d3a;}
#titleSub{letter-spacing:6px;font-size:12px;color:var(--blue);font-weight:800;}
#titleBlocks{display:flex;gap:6px;align-items:flex-end;height:70px;}
#titleBlocks i{display:block;width:18px;border-radius:3px 3px 0 0;animation:grow 1.6s ease-in-out infinite alternate;}
#loadBar{width:240px;height:8px;border-radius:8px;background:#23285a;overflow:hidden;}
#loadBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--green));transition:width .5s;}
#titleHint{font-size:12px;color:var(--dim);max-width:420px;line-height:1.4;}

/* Interior */
.interiorWrap{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;}
.interiorWrap canvas{width:100%;height:230px;border-radius:12px;background:#1a1d33;display:block;}
.istat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
.istat b{font-weight:800;}
.workerCtl{display:flex;align-items:center;gap:8px;margin-top:8px;}
.workerCtl .wv{flex:1;text-align:center;font-weight:900;font-size:18px;}

/* Animations */
@keyframes pop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes toastIn{from{transform:translateY(-12px);opacity:0;}to{transform:none;opacity:1;}}
@keyframes toastOut{to{transform:translateY(-10px);opacity:0;}}
@keyframes pulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.35);}}
@keyframes bigPop{0%{transform:scale(.3);opacity:0;}15%{transform:scale(1.15);opacity:1;}25%{transform:scale(1);}80%{opacity:1;}100%{opacity:0;transform:translateY(-40px);}}
@keyframes grow{from{height:20%;}to{height:100%;}}

/* Section 9: RESPONSIVE / MOBILE LAYOUT -------------------------------- */
@media (max-width:1100px){
  :root{--panel-w:340px;--right-w:280px;}
}
@media (max-width:820px){
  :root{--top-h:52px;--nav-w:0px;--nav-h:62px;}
  #logo{display:none;}
  #topbar{gap:5px;padding:0 6px;}
  .stat{padding:5px 7px;gap:4px;}
  .stat .lbl{display:none;}
  .stat .val{font-size:12.5px;}
  #settingsBtn{display:none;}
  .navbtn.mobileOnly{display:flex !important;}
  #clockBox .t{font-size:13px;}
  .speedBtns button{padding:6px 6px;font-size:11px;}
  .stat.hideM{display:none;}
  #clockBox .d{display:none;}
  #leftnav{top:auto;bottom:0;left:0;right:0;width:auto;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0));flex-direction:row;padding:5px 6px calc(5px + env(safe-area-inset-bottom,0));border-right:none;border-top:1px solid var(--line);}
  .navbtn{flex:1;height:52px;}
  .navsep{display:none;}
  #leftPanel{left:0;right:0;width:auto;top:auto;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0));height:62vh;border-radius:18px 18px 0 0;border-right:none;transform:translateY(110%);}
  #leftPanel.open{transform:translateY(0);}

  d.unlock = d.unlock || {};
  // Derived salary per worker ($/s): about 20% of the revenue the building makes at default staff
  if (d.sal === undefined) {
    var base = d.rev || (d.goods * EXPORT_PRICE) || (d.power > 0 ? d.power * 0.01 : 0) || (d.transit * 0.01) || 0.5;
    d.sal = d.workers > 0 ? Math.max(0.02, base * 0.2 / d.workers) : 0;
  }
  if (d.maint === undefined) d.maint = d.rev ? d.rev * 0.06 : (d.goods ? d.goods * GOODS_PRICE * 0.05 : (d.power > 0 ? d.power * 0.004 : 0.02));
  BUILDINGS[d.id] = d;
});

/* --- Small utilities --------------------------------------------------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function num(v, def, min, max) {
  v = Number(v);
  if (!isFinite(v)) v = def;
  if (min !== undefined && v < min) v = min;
  if (max !== undefined && v > max) v = max;
  return v;
}
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmt(n, dec) {
  if (!isFinite(n)) n = 0;
  const neg = n < 0; n = Math.abs(n);
  const u = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
  let i = 0;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  let s;
  if (i === 0) s = (dec !== undefined ? n.toFixed(dec) : (n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toString()));
  else s = (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + u[i];
  return (neg ? '-' : '') + s;
}
function money(n, dec) { return (n < 0 ? '-$' : '$') + fmt(Math.abs(n), dec); }
function signMoney(n) { return (n >= 0 ? '+$' : '-$') + fmt(Math.abs(n), Math.abs(n) < 10 ? 2 : undefined); }
function pct(v) { return Math.round(v) + '%'; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }

/* --- Prestige helpers (meta survives resets) ---------------------------- */
function ppLevel(id) { return (S && S.meta.ppUpgrades[id]) | 0; }
function costMult() { return 1 + 0.15 * (S ? S.meta.ngLevel : 0); }
function newMeta() {
  return { created: Date.now(), ngLevel: 0, prestigeCount: 0, pp: 0, ppUpgrades: {}, skins: ['classic'], crown: false, bestPop: 0, lifetimeRevenue: 0 };
}
function defaultSettings() {
  return {
    sound: true, music: false, quality: IS_MOBILE ? 'LOW' : 'HIGH', autoQuality: true, showFps: false,
    confirm: IS_TOUCH ? 'always' : 'expensive', skin: 'classic', speed: 1
  };
}

/* Build a brand-new game state (optionally keeping meta/settings/achievements). */
function defaultState(meta, settings, achievements, lifetime) {
  meta = meta || newMeta();
  const size = meta.ngLevel >= 1 ? 48 : 40;
  const st = {
    version: SAVE_VERSION,
    meta: meta,
    money: 100 + ((meta.ppUpgrades.start | 0) * 2500),
    city: {
      name: 'Block City', population: 5, peakPop: 5, happiness: 62, crime: 4, pollution: 0, tax: 10,
      expansion: 0, size: size, seed: (Math.random() * 1e9) | 0, roads: '', nature: '',
      tourismUnlocked: false, tourists: 0, traffic: 0
    },
    buildings: { nextId: 1, list: [] },
    workers: { salaryPolicy: 'normal' },
    research: { rp: 0, total: 0 },
    technology: { unlocked: [] },
    companies: { list: {}, stocks: {}, portfolio: {}, tradeProfit: 0 },
    bank: { loans: [], credit: 70, repaid: 0, nextId: 1 },
    transport: { riders: 0 },
    economy: { noise: {}, goodsStock: 0 },
    events: { active: [], nextCrisisAt: 600, nextDisasterAt: 1800, nextGlobalAt: 900, nextTipAt: 20, nextFireCheck: 60, hosted: 0, cooldowns: {} },
    statistics: {
      history: { pop: [], rev: [], crime: [], pol: [], emp: [] },
      totals: lifetime || { revenue: 0, built: 0, spent: 0, disasters: 0, crises: 0, playSec: 0 },
      run: { revenue: 0 }
    },
    achievements: achievements || {},
    quests: { mission: 0, side: {} },
    tutorial: { done: false, dismissed: {} },
    settings: settings || defaultSettings(),
    clock: { gameSec: 6 * 3600, runSec: 0 },
    lastNet: 0,
    lastSaveTime: Date.now()
  };
  NPC_STOCKS.forEach(function (s) { st.companies.stocks[s.id] = { price: s.base, hist: [s.base] }; });
  return st;
}

/* Collect the persistent part of a building (runtime fields start with "_"). */
function serializeBuilding(b) {
  return { id: b.id, type: b.type, x: b.x, y: b.y, level: b.level, workers: b.workers, built: b.built,
    progress: +b.progress.toFixed(4), buildTime: b.buildTime, upg: +(b.upg || 0).toFixed(4), upgTime: b.upgTime, damaged: b.damaged,
    repair: b.repair, fire: b.fire, vault: Math.floor(b.vault || 0), visitors: b.visitors | 0 };
}

function buildSaveObject() {
  const o = {};
  for (const k in S) { if (k !== 'buildings' && k !== 'debugUnlockAll') o[k] = S[k]; }
  o.buildings = { nextId: S.buildings.nextId, list: S.buildings.list.map(serializeBuilding) };
  o.city = Object.assign({}, S.city, { roads: encodeGrid(MAP.roads), nature: encodeGrid(MAP.nature) });
  o.version = SAVE_VERSION;
  o.lastSaveTime = Date.now();
  o.lastNet = Math.max(0, SIM.net);
  return o;
}

function saveGame(silent) {
  try {
    const json = JSON.stringify(buildSaveObject());
    const prev = localStorage.getItem(SAVE_KEY);
    if (prev) localStorage.setItem(SAVE_BACKUP_KEY, prev);   // rotate backup
    localStorage.setItem(SAVE_KEY, json);
    S.lastSaveTime = Date.now();
    if (!silent) toast('💾 Game saved', 'good');
    return true;
  } catch (e) {
    if (!silent) toast('⚠️ Could not save (storage full or blocked)', 'bad');
    return false;
  }
}

/* --- Save migration: v1 (legacy Part 1/2) → v2 → v3 --------------------- */
function migrateSave(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('Invalid save');
  let v = d.version | 0;
  if (!v) { d = migrateV1toV2(d); v = 2; }
  if (v === 2) { d = migrateV2toV3(d); v = 3; }
  if (v > SAVE_VERSION) console.warn('Save from a newer version; loading best-effort.');
  d.version = SAVE_VERSION;
  return d;
}
/* v1 = original single-screen tycoon (money/totalEarned/prestigeCount/buildings map) */
function migrateV1toV2(o) {
  const legacyMoney = num(o.money, 0, 0, 1e9);
  return {
    version: 2,
    money: Math.min(legacyMoney, 5000) + 100,
    population: 5,
    prestigePoints: num(o.prestigeCount, 0, 0, 100),
    achievementsLegacy: o.achievements ? Object.keys(o.achievements).length : 0,
    settings: { sound: o.settings ? o.settings.sound !== false : true, music: o.settings ? !!o.settings.music : false },
    legacy: true
  };
}
/* v2 = flat format (money, population, tax, buildings[], tech[], research) */
function migrateV2toV3(o) {
  const meta = newMeta();
  meta.pp = num(o.prestigePoints, 0, 0, 1e6);
  const st = defaultState(meta, Object.assign(defaultSettings(), o.settings || {}));
  st.money = num(o.money, 100, 0, MONEY_CAP);
  st.city.population = num(o.population, 5, 0, 1e7);
  st.city.tax = num(o.tax, 10, 0, MAX_TAX);
  if (Array.isArray(o.buildings)) st.buildings.list = o.buildings;
  if (Array.isArray(o.tech)) st.technology.unlocked = o.tech;
  st.research.rp = num(o.research, 0, 0, 1e9);
  st.migratedFrom = o.legacy ? 1 : 2;
  return st;
}

/* --- Validation: repair anything that could break the game -------------- */
function sanitizeState(d) {
  const meta = Object.assign(newMeta(), d.meta || {});
  meta.ngLevel = num(meta.ngLevel, 0, 0, 20) | 0;
  meta.prestigeCount = num(meta.prestigeCount, 0, 0, 1e4) | 0;
  meta.pp = num(meta.pp, 0, 0, 1e7);
  meta.ppUpgrades = (meta.ppUpgrades && typeof meta.ppUpgrades === 'object') ? meta.ppUpgrades : {};
  PRESTIGE_UPGRADES.forEach(function (u) { meta.ppUpgrades[u.id] = num(meta.ppUpgrades[u.id], 0, 0, u.max) | 0; });
  for (const k in meta.ppUpgrades) if (!PRESTIGE_UPGRADES.some(function (u) { return u.id === k; })) delete meta.ppUpgrades[k];
  meta.skins = Array.isArray(meta.skins) ? meta.skins.filter(function (s) { return ['classic', 'neon', 'gold'].indexOf(s) >= 0; }) : ['classic'];
  if (meta.skins.indexOf('classic') < 0) meta.skins.unshift('classic');

  const base = defaultState(meta, Object.assign(defaultSettings(), d.settings || {}), null, null);
  const st = base;
  st.meta = meta;
  st.money = num(d.money, 100, 0, MONEY_CAP);

  // City
  const c = d.city || {};
  st.city.size = (c.size === 48 || c.size === 40) ? c.size : (meta.ngLevel >= 1 ? 48 : 40);
  st.city.seed = num(c.seed, st.city.seed) | 0;
  st.city.population = num(c.population, 5, 0, 1e7);
  st.city.peakPop = num(c.peakPop, st.city.population, 0, 1e7);
  st.city.happiness = num(c.happiness, 60, 0, 100);
  st.city.crime = num(c.crime, 5, 0, 100);
  st.city.pollution = num(c.pollution, 0, 0, 100);
  st.city.tax = Math.round(num(c.tax, 10, 0, MAX_TAX));
  st.city.expansion = num(c.expansion, 0, 0, maxExpansionFor(st.city.size)) | 0;
  st.city.tourismUnlocked = !!c.tourismUnlocked;
  st.city.tourists = num(c.tourists, 0, 0, 1e7);
  st.city.traffic = num(c.traffic, 0, 0, 100);
  st.city.roads = typeof c.roads === 'string' ? c.roads : '';
  st.city.nature = typeof c.nature === 'string' ? c.nature : '';

  // Simple sub-objects
  st.workers.salaryPolicy = (d.workers && ['low', 'normal', 'high'].indexOf(d.workers.salaryPolicy) >= 0) ? d.workers.salaryPolicy : 'normal';
  st.research.rp = num(d.research && d.research.rp, 0, 0, 1e12);
  st.research.total = num(d.research && d.research.total, 0, 0, 1e13);
  const techs = (d.technology && Array.isArray(d.technology.unlocked)) ? d.technology.unlocked : [];
  st.technology.unlocked = techs.filter(function (t, i) { return TECHS[t] && techs.indexOf(t) === i; });

  // Companies & stocks
  const cp = d.companies || {};
  COMPANY_DEFS.forEach(function (cd) {
    const src = cp.list && cp.list[cd.id];
    if (src && typeof src === 'object') {
      st.companies.list[cd.id] = {
        level: num(src.level, 1, 1, 10) | 0, xp: num(src.xp, 0, 0, 1e15), own: num(src.own, 1, 0.5, 1),
        price: num(src.price, 1, 0.01, 1e9), hist: Array.isArray(src.hist) ? src.hist.filter(isFinite).slice(-120) : [],
        products: num(src.products, 0, 0, 4) | 0, founded: num(src.founded, Date.now())
      };
    }
  });
  NPC_STOCKS.forEach(function (s) {
    const src = cp.stocks && cp.stocks[s.id];
    st.companies.stocks[s.id] = { price: num(src && src.price, s.base, 0.5, 1e6), hist: (src && Array.isArray(src.hist)) ? src.hist.filter(isFinite).slice(-120) : [s.base] };
  });
  if (cp.portfolio) for (const id in cp.portfolio) {
    if (!NPC_STOCKS.some(function (s) { return s.id === id; })) continue;
    const p = cp.portfolio[id];
    const q = num(p && p.qty, 0, 0, 1e9) | 0;
    if (q > 0) st.companies.portfolio[id] = { qty: q, cost: num(p.cost, 0, 0, 1e15) };
  }
  st.companies.tradeProfit = num(cp.tradeProfit, 0, -1e15, 1e15);

  // Bank
  const bk = d.bank || {};
  st.bank.credit = num(bk.credit, 70, 0, 100);
  st.bank.repaid = num(bk.repaid, 0, 0, 1e6) | 0;
  st.bank.nextId = num(bk.nextId, 1, 1, 1e9) | 0;
  st.bank.loans = (Array.isArray(bk.loans) ? bk.loans : []).map(function (l) {
    return { id: num(l.id, st.bank.nextId++, 0) | 0, principal: num(l.principal, 0, 0, 1e12), total: num(l.total, 0, 0, 1e12),
      remaining: num(l.remaining, 0, 0, 1e12), perSec: num(l.perSec, 1, 0.0001, 1e10), rate: num(l.rate, 0.05, 0, 1) };
  }).filter(function (l) { return l.remaining > 0.01; }).slice(0, 5);

  st.economy.goodsStock = num(d.economy && d.economy.goodsStock, 0, 0, 1e12);
  if (d.economy && d.economy.noise) SECTORS.forEach(function (s) { st.economy.noise[s] = num(d.economy.noise[s], 1, 0.8, 1.2); });

  // Events (only known ids survive)
  const ev = d.events || {};
  ['nextCrisisAt', 'nextDisasterAt', 'nextGlobalAt', 'nextTipAt', 'nextFireCheck'].forEach(function (k) { st.events[k] = num(ev[k], st.events[k], 0, 1e12); });
  st.events.hosted = num(ev.hosted, 0, 0, 1e6) | 0;
  st.events.cooldowns = {};
  if (ev.cooldowns) GLOBAL_EVENTS.forEach(function (g) { if (ev.cooldowns[g.id]) st.events.cooldowns[g.id] = num(ev.cooldowns[g.id], 0, 0, 1e12); });
  st.events.active = (Array.isArray(ev.active) ? ev.active : []).filter(function (a) {
    return a && ((a.kind === 'crisis' && CRISES.some(function (x) { return x.id === a.id; })) ||
      (a.kind === 'disaster' && DISASTERS.some(function (x) { return x.id === a.id; })) ||
      (a.kind === 'global' && GLOBAL_EVENTS.some(function (x) { return x.id === a.id; })));
  }).map(function (a) { return { kind: a.kind, id: a.id, ends: num(a.ends, 0, 0, 1e12), start: num(a.start, 0, 0, 1e12) }; });

  // Statistics
  const sd = d.statistics || {};
  const tot = sd.totals || {};
  ['revenue', 'built', 'spent', 'disasters', 'crises', 'playSec'].forEach(function (k) { st.statistics.totals[k] = num(tot[k], 0, 0, 1e18); });
  st.statistics.run.revenue = num(sd.run && sd.run.revenue, 0, 0, 1e18);
  ['pop', 'rev', 'crime', 'pol', 'emp'].forEach(function (k) {
    const h = sd.history && Array.isArray(sd.history[k]) ? sd.history[k] : [];
    st.statistics.history[k] = h.map(Number).filter(isFinite).slice(-150);
  });

/* Validate buildings against the map: unknown types, invalid levels,

function validateBuildings(raw) {
  const seenIds = {}; const uniques = {}; let maxId = 0; let dropped = 0; let tmp = 0;
  S.buildings.list = [];
  raw.forEach(function (r) {
    if (!r || typeof r !== 'object') { dropped++; return; }
    const d = BUILDINGS[r.type];
    if (!d) { dropped++; return; }
    const x = num(r.x, -1) | 0, y = num(r.y, -1) | 0;
    if (x < 0 || y < 0 || x + d.w > MAP.W || y + d.h > MAP.H) { dropped++; return; }
    if (d.unique && uniques[d.id]) { dropped++; return; }
    if (!inUnlocked(x, y) || !inUnlocked(x + d.w - 1, y + d.h - 1)) { dropped++; return; }
    // Overlap check (duplicate buildings on same tiles)
    for (let yy = y; yy < y + d.h; yy++) for (let xx = x; xx < x + d.w; xx++) {
      const i = yy * MAP.W + xx;
      if (MAP.occ[i] || MAP.nature[i] === 2) { dropped++; return; }
    }
    let id = num(r.id, 0) | 0;
    if (id <= 0 || seenIds[id]) id = -(++tmp);   // temporary id, fixed below
    const b = makeBuilding(d.id, x, y, id);
    b.level = clamp(num(r.level, 1) | 0, 1, MAX_LEVEL);
    b.workers = clamp(num(r.workers, d.workers) | 0, 0, d.maxW);
    b.built = r.built !== false;
    b.progress = num(r.progress, 1, 0, 1);
    b.buildTime = num(r.buildTime, 5, 1, 600);
    b.upg = b.level < MAX_LEVEL ? num(r.upg, 0, 0, 1) : 0;
    b.upgTime = num(r.upgTime, 5, 1, 600);
    b.damaged = r.damaged ? 1 : 0;
    b.repair = num(r.repair, 0, 0, 1000);
    b.fire = num(r.fire, 0, 0, 120);
    b.vault = num(r.vault, 0, 0, 1e15);
    b.visitors = num(r.visitors, 0, 0, 1e9) | 0;

  S.buildings.nextId = Math.max(S.buildings.nextId, maxId + 1);
  rebuildOcc();

}

function loadRaw(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return undefined; }   // undefined = corrupted
}

/* Load (with fallbacks): main save → backup → legacy saves → new game */
function loadGame() {
  const notes = [];
  let data = loadRaw(SAVE_KEY);
  let st = null;
  const tryUse = function (d, label) {
    if (!d) return false;
    try { st = sanitizeState(migrateSave(d)); return true; }
    catch (e) { notes.push(label + ' save was corrupted.'); return false; }
  };
  if (data === undefined) notes.push('Main save was corrupted.');
  if (!tryUse(data, 'Main')) {
    const bk = loadRaw(SAVE_BACKUP_KEY);
    if (tryUse(bk, 'Backup')) notes.push('Restored from backup save.');
    else {
      for (let i = 0; i < LEGACY_SAVE_KEYS.length && !st; i++) {
        const lg = loadRaw(LEGACY_SAVE_KEYS[i]);
        if (lg && tryUse(lg, 'Legacy')) notes.push('Legacy save converted to PRO Edition (v' + SAVE_VERSION + ').');
      }
    }
  }
  const isNew = !st;
  if (!st) st = defaultState();
  S = st;
  initMap(isNew);
  const dropped = validateBuildings(S._rawBuildings || []);
  delete S._rawBuildings;
  if (dropped > 0) notes.push(dropped + ' invalid building(s) were removed from the save.');
  if (isNew) placeStarterCity();
  onMapChanged();
  return { isNew: isNew, notes: notes };
}

function exportSave() {
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(buildSaveObject())))); } catch (e) { return ''; }
}
function importSave(text) {
  try {
    const json = decodeURIComponent(escape(atob(String(text).trim())));
    const d = JSON.parse(json);
    const st = sanitizeState(migrateSave(d));   // throws on bad data
    const raw = st._rawBuildings || [];

}

/* ================================ 4. MAP ================================ */
const MAP = {
  W: 40, H: 40, roads: null, nature: null, occ: null, inter: null, comp: null, coverGrid: null,
  roadCount: 0, byId: new Map(), pathCache: new Map(), version: 0, groundDirty: true,
  lists: { FOOD: [], SHOPPING: [], ENTERTAINMENT: [], parks: [], homes: [], jobs: [], commercial: [], factories: [], busstops: [], metros: [], trains: [], fire: [], police: [], health: [], tourism: [] }
};

function maxExpansionFor(size) { let m = 0; for (let i = 0; i < EXPANSION_SIZES.length; i++) if (EXPANSION_SIZES[i] <= size) m = i; return m; }
function unlockedRect() {
  const size = Math.min(MAP.W, EXPANSION_SIZES[S.city.expansion] || MAP.W);
  const x0 = Math.floor((MAP.W - size) / 2), y0 = Math.floor((MAP.H - size) / 2);
  return { x0: x0, y0: y0, x1: x0 + size - 1, y1: y0 + size - 1 };
}
function inUnlocked(x, y) { const r = unlockedRect(); return x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1; }

/* Create the terrain: a river on the west side, a lake in the south-east, forests. */
function generateNature(seed) {
  const rnd = mulberry32(seed);
  const W = MAP.W, H = MAP.H, n = MAP.nature;
  n.fill(0);
  let rx = 3 + rnd() * 2;
  for (let y = 0; y < H; y++) {
    rx += (rnd() - 0.5) * 0.9; rx = clamp(rx, 1.5, 5.5);
    const wdt = 2 + (rnd() < 0.3 ? 1 : 0);
    for (let x = Math.floor(rx); x < Math.floor(rx) + wdt; x++) if (inMap(x, y)) n[idx(x, y)] = 2;
  }
  const lx = W - 6, ly = H - 6;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = Math.hypot((x - lx) / 4.2, (y - ly) / 3.2);
    if (d < 1 + rnd() * 0.25) n[idx(x, y)] = 2;
  }
  const c = W / 2;
  for (let i = 0; i < W * H * 0.07; i++) {
    const cx = Math.floor(rnd() * W), cy = Math.floor(rnd() * H);
    const r = 1 + rnd() * 2.5;
    for (let y = cy - 3; y <= cy + 3; y++) for (let x = cx - 3; x <= cx + 3; x++) {
      if (!inMap(x, y) || n[idx(x, y)] === 2) continue;
      if (Math.abs(x - c) < 5 && Math.abs(y - c) < 5) continue;

}
function initMap(isNew) {
  MAP.W = MAP.H = S.city.size;
  const N = MAP.W * MAP.H;
  MAP.roads = new Uint8Array(N); MAP.nature = new Uint8Array(N); MAP.occ = new Int32Array(N);
  MAP.inter = new Uint8Array(N); MAP.comp = new Int32Array(N);
  MAP.parent = new Int32Array(N); MAP.queue = new Int32Array(N);
  MAP.byId.clear();
  S.buildings.list = [];
  const okNature = !isNew && decodeGrid(S.city.nature, MAP.nature, 2);
  if (!okNature) generateNature(S.city.seed);
  const okRoads = !isNew && decodeGrid(S.city.roads, MAP.roads, 1);
  if (!okRoads) defaultRoads();
  for (let i = 0; i < N; i++) if (MAP.roads[i] && MAP.nature[i] === 2) MAP.roads[i] = 0;

/* Starting plot: 1 small house (5 citizens) + 1 basic production machine */
function placeStarterCity() {

  const h = makeBuilding('house', c - 2, c - 1); addBuildingToMap(h);
  const w = makeBuilding('workshop', c + 1, c + 1); addBuildingToMap(w);
  const p = makeBuilding('park', c - 3, c + 1); addBuildingToMap(p);

/* --- Buildings on the map ---------------------------------------------- */
function makeBuilding(type, x, y, id) {
  const d = BUILDINGS[type];

    id: (id === undefined || id === null) ? S.buildings.nextId++ : id,
    type: type, x: x, y: y, level: 1, workers: d.workers, built: true, progress: 1, buildTime: 1,
    upg: 0, upgTime: 1, damaged: 0, repair: 0, fire: 0, vault: 0, visitors: 0,
    // runtime (not saved)
    _eff: 0, _rev: 0, _cost: 0, _actW: 0, _powered: true, _road: false, _entry: -1, _op: false, _tip: 0, _cust: 0, _cov: null, _anim: Math.random() * 10

}

}

    const d = BUILDINGS[b.type];

}

  for (let y = b.y; y < b.y + d.h; y++) for (let x = b.x; x < b.x + d.w; x++) if (MAP.occ[idx(x, y)] === b.id) MAP.occ[idx(x, y)] = 0;

function countAny(type) { let n = 0; const l = S.buildings.list; for (let i = 0; i < l.length; i++) if (l[i].type === type) n++; return n; }

function hasTech(id) { return S.technology.unlocked.indexOf(id) >= 0; }

/* Unlock requirements → {ok, reason} */
function unlockStatus(d) {
  if (S.debugUnlockAll) return { ok: true };
  const u = d.unlock;
  if (u.ng && S.meta.ngLevel < u.ng) return { ok: false, reason: 'New Game+ ' + u.ng };
  if (u.tech && !hasTech(u.tech)) return { ok: false, reason: '🔬 ' + TECHS[u.tech].name };
  if (u.company) {
    const c = S.companies.list[u.company];
    if (!c || c.level < u.lvl) return { ok: false, reason: companyDef(u.company).name + ' Lv' + u.lvl };
  }
  if (u.pop && S.city.peakPop < u.pop) return { ok: false, reason: '👥 ' + fmt(u.pop) + ' pop' };
  if (u.tourism && !S.city.tourismUnlocked) return { ok: false, reason: 'Tourism (1.5K pop)' };
  if (u.exp && S.city.expansion < u.exp) return { ok: false, reason: 'Land expansion ' + u.exp };

/* Can building type d be placed with its top-left at (x,y)? */
function canPlace(d, x, y) {
  if (x < 0 || y < 0 || x + d.w > MAP.W || y + d.h > MAP.H) return { ok: false, reason: 'Out of map' };
  let road = false;
  for (let yy = y; yy < y + d.h; yy++) for (let xx = x; xx < x + d.w; xx++) {
    const i = idx(xx, yy);
    if (!inUnlocked(xx, yy)) return { ok: false, reason: 'Locked land — expand the city' };
    if (MAP.nature[i] === 2) return { ok: false, reason: 'Cannot build on water' };
    if (MAP.roads[i]) return { ok: false, reason: 'Road in the way' };
    if (MAP.occ[i]) return { ok: false, reason: 'Space occupied' };
  }
  for (let xx = x; xx < x + d.w; xx++) { if (isRoad(xx, y - 1) || isRoad(xx, y + d.h)) road = true; }
  for (let yy = y; yy < y + d.h; yy++) { if (isRoad(x - 1, yy) || isRoad(x + d.w, yy)) road = true; }
  const st = unlockStatus(d);
  if (!st.ok) return { ok: false, reason: 'Locked: ' + st.reason };
  if (S.money < buildCost(d)) return { ok: false, reason: 'Not enough money', money: true };
  return { ok: true, warn: (!road && !d.noRoad) ? 'No road access — it will not operate!' : '' };

function placeBuilding(d, x, y) {

  const cost = buildCost(d);
  S.money -= cost;
  S.statistics.totals.spent += cost;
  const b = makeBuilding(d.id, x, y);
  b.built = false; b.progress = 0; b.buildTime = buildTimeFor(d.cost);
  addBuildingToMap(b);

  spawnParticles(c.x, c.y, 'dust', 14);
  floatText(c.x, c.y - 20, '-' + money(cost), '#ff8fa3');
  UI.idleTimer = 0;

}
function upgradeBuilding(b) {

  if (b.level >= MAX_LEVEL) { toast('Max level reached', 'bad'); sfx('error'); return; }
  const cost = upgradeCost(b);
  if (S.money < cost) { toast('❌ Not enough money', 'bad'); sfx('error'); return; }

  S.money = Math.min(MONEY_CAP, S.money + refund);

/* Cached per-type building lists used by the agents & economy */

/* Service coverage (fire / police / health) — fraction of buildings covered */
function coverRadius(b) {

  return d.cover * (hasTech('d_emergency') ? 1.3 : 1) * (0.55 + 0.45 * clamp(b._eff || (b.built ? 1 : 0), 0, 1.3)) * (1 + 0.1 * (b.level - 1));

/* ============================ 5. ECONOMY SIM ============================ */

function gameDay() { return Math.floor(S.clock.gameSec / 86400) + 1; }

function maxCompanyLevel() { let m = 0; for (const k in S.companies.list) m = Math.max(m, S.companies.list[k].level); return m; }

  if (S.meta.crown) m.rev *= 1.10;
  if (hasTech('b_global')) m.rev *= 1.15;

  m.rp *= 1 + 0.05 * ppLevel('research');
  m.tax *= 1 + 0.05 * ppLevel('tax');

    const d = BUILDINGS[b.type];

    if (d.bonus.rev) m.rev *= 1 + d.bonus.rev;
    if (d.bonus.tour) m.tour *= 1 + d.bonus.tour;
    if (d.bonus.hap) m.hap += d.bonus.hap;
    if (d.bonus.tax) m.tax *= 1 + d.bonus.tax;
    if (d.bonus.rp) m.rp *= 1 + d.bonus.rp;

    if (d.power > 0 && gen > 0) { const e = surplus * b._gen / gen; r += e; R.energy += e; }
    b._rev = r;
    if (cid) { compStats[cid].rev += r; compStats[cid].emp += b._actW; }
  }
  // Income tax on employed citizens
  const taxIncome = employed * WAGE_PER_WORKER * (city.tax / 100) * mods.tax;
  R.tax = taxIncome;

  // --- 9. Expenses ------------------------------------------------------------
  const E = { salaries: 0, maintenance: 0, electricity: fuelCost * mods.electricity, loans: 0, dividends: 0 };
  for (let i = 0; i < list.length; i++) {
    const b = list[i], d = BUILDINGS[b.type];
    if (!b.built) { b._cost = 0; continue; }
    const sal = b._actW * d.sal * pol.sal;
    const mt = d.maint * lvlMult(b.level);
    E.salaries += sal; E.maintenance += mt;
    b._cost = sal + mt + (d.fuel ? b._gen * d.fuel * mods.electricity : 0);
    const cid = companyForSector(d.sector);
    if (cid) compStats[cid].cost += b._cost;
  }
  for (const cid in compStats) {
    const cs = compStats[cid]; cs.profit = cs.rev - cs.cost;
    const c = S.companies.list[cid];
    if (c && cs.profit > 0 && c.own < 1) E.dividends += cs.profit * (1 - c.own);
  }
  SIM.companies = compStats;
  S.bank.loans.forEach(function (l) { E.loans += Math.min(l.perSec, l.remaining / dt); });

  let income = 0; for (const k in R) income += R[k];
  let expenses = 0; for (const k in E) expenses += E[k];
  SIM.rev = R; SIM.exp = E; SIM.income = income; SIM.expenses = expenses; SIM.net = income - expenses; SIM.taxIncome = taxIncome;

  // Apply cash flow (loans paid separately so missed payments can be tracked)
  const netNoLoans = income - (expenses - E.loans);
  S.money += netNoLoans * dt;
  if (!isFinite(S.money)) S.money = 0;
  if (S.money < 0) { S.money = 0; SIM.unpaid = 5; } else if (SIM.unpaid > 0) SIM.unpaid -= dt;
  S.money = Math.min(S.money, MONEY_CAP);
  bankTick(dt);
  S.statistics.totals.revenue += income * dt;
  S.statistics.run.revenue += income * dt;
  S.meta.lifetimeRevenue += income * dt;

  // --- 10. Traffic ---------------------------------------------------------
  const rush = (hour >= 7 && hour < 9.5) || (hour >= 16.5 && hour < 19) ? 1.3 : (hour < 5 ? 0.4 : 0.9);
  const roadCap = MAP.roadCount * 7 * (hasTech('t_roads') ? 1.25 : 1);
  const carTrips = Math.max(0, trips - riders) * rush + gProd * 0.3;
  let trafficT = 100 * carTrips / (roadCap + 20) * (hasTech('t_lights') ? 0.85 : 1) * (hasTech('ng_hyperloop') ? 0.7 : 1);
  if (AG.vehicles.length >= 6) trafficT = trafficT * 0.8 + SIM.visualStopRatio * 100 * 0.2;
  SIM.traffic = lerp(SIM.traffic, clamp(trafficT, 0, 100), 0.1 * dt);
  city.traffic = SIM.traffic;
  SIM.transitCap = transitCap; SIM.riders = riders; SIM.trips = trips; SIM.carTrips = carTrips;

  // --- 11. Pollution ---------------------------------------------------------
  let raw = 0, absorb = 0;
  for (let i = 0; i < list.length; i++) {
    const b = list[i], d = BUILDINGS[b.type];
    if (!b.built) continue;
    if (d.pol > 0 && b._op) raw += d.pol * lvlMult(b.level) * Math.max(0.3, b._eff) * (d.cat === 'Industry' || d.smoke ? (hasTech('env_filters') ? 0.7 : 1) : 1);
    else if (d.pol < 0) absorb += -d.pol * lvlMult(b.level) * (hasTech('env_green') ? 2 : 1);
  }
  raw += pop * 0.004 * (SIM.traffic / 50) * (hasTech('t_ev') ? 0.4 : 1);
  let netPol = Math.max(0, raw - absorb) * (hasTech('env_recycle') ? 0.85 : 1) * (hasTech('env_carbon') ? 0.6 : 1);
  const polT = 100 * netPol / (netPol + 30 + builtTiles * 0.6);
  city.pollution = clamp(lerp(city.pollution, polT, 0.06 * dt), 0, 100);

  // --- 12. Crime --------------------------------------------------------------
  const density = Math.min(15, pop / (builtTiles * 25 + 1) * 5);
  const small = Math.min(1, pop / 200);   // tiny villages have little crime
  let crimeT = 3 + (unemployment * 110 + Math.max(0, 55 - city.happiness) * 0.5 + density) * small + (pop > 150 ? (1 - SIM.cov.police) * 30 : 0);
  if (hasTech('d_police')) crimeT *= 0.85;
  city.crime = clamp(lerp(city.crime, clamp(crimeT, 0, 100), 0.05 * dt), 0, 100);

  // --- 13. Happiness ------------------------------------------------------------
  const F = [];
  const add = function (label, v) { if (Math.abs(v) >= 0.05) F.push([label, v]); return v; };
  let h = 58;
  h += add('Services coverage', (SIM.cov.fire + SIM.cov.police + SIM.cov.health) / 3 * 15);
  let green = 0;
  for (let i = 0; i < list.length; i++) { const b = list[i], d = BUILDINGS[b.type]; if (d.hap && b._op) green += d.hap * lvlMult(b.level) * Math.max(0.5, b._eff); }
  h += add('Parks & culture', Math.min(12, green * 1.5 / (pop / 100 + 2)));
  if (pop > 20) {
    h += add('Entertainment', 8 * Math.min(1, supply.ENTERTAINMENT / Math.max(1, demand.ENTERTAINMENT)) - 4);
    h += add('Food availability', 6 * Math.min(1, supply.FOOD / Math.max(1, demand.FOOD)) - 3);
  }
  h += add('Tax rate', city.tax > 10 ? -(city.tax - 10) * 1.4 : (10 - city.tax) * 0.5);
  h += add('Unemployment', -unemployment * 45);
  h += add('Crime', -city.crime * 0.18);
  h += add('Pollution', -city.pollution * 0.2);
  h += add('Traffic', -SIM.traffic * 0.1);
  h += add('Power shortage', -(1 - powerRatio) * 25);
  h += add('Water shortage', -(1 - waterRatio) * 30);
  if (pop > housingCap * 1.02 + 1) h += add('Homelessness', -8);
  h += add('Season', season.hap + (FX.weather === 'rain' ? -2 : 0));
  h += add('Salary policy', pol.hap);
  h += add('Landmarks & events', mods.hap);
  if (hasTech('c_smart')) h += add('Smart City', 8);
  if (SIM.unpaid > 0) h += add('Unpaid bills', -15);
  SIM.hapFactors = F; SIM.hapTarget = clamp(h, 0, 100);
  city.happiness = clamp(lerp(city.happiness, SIM.hapTarget, 0.05 * dt), 0, 100);

  // --- 14. Tourism ----------------------------------------------------------------
  if (!city.tourismUnlocked && city.peakPop >= 1500) {
    city.tourismUnlocked = true;
    notify('🧳 TOURISM unlocked! Build hotels, museums and attractions.', 'gold');
    sfx('levelup');
  }
  let touristsT = 0;
  if (city.tourismUnlocked) {
    const attraction = tourWeight + pop * 0.03;
    touristsT = attraction * 0.2 * (1 - city.pollution / 150) * (1 - city.crime / 200) * (0.6 + city.happiness / 250) * season.tour * mods.tour;
  }
  city.tourists = Math.max(0, lerp(city.tourists, touristsT, 0.05 * dt));

  // --- 15. Population dynamics ------------------------------------------------------
  let metroBonus = 0;
  MAP.lists.metros.forEach(function (b) { if (b._op) metroBonus += 0.05; });
  MAP.lists.trains.forEach(function (b) { if (b._op) metroBonus += 0.08; });
  const jobsFactor = unemployment < 0.12 ? 0.15 : -(unemployment - 0.12) * 1.6;
  const A = (city.happiness - 50) / 50 + jobsFactor - Math.max(0, city.tax - 10) * 0.035 - city.pollution * 0.004 + Math.min(0.3, metroBonus);
  const gmult = mods.growth * season.growth;
  let p = pop;
  if (A > 0 && p < housingCap) p += Math.min(housingCap - p, (p * 0.006 + 0.3) * A * gmult * dt);
  if (A < 0) p -= p * 0.003 * (-A) * dt;
  if (city.tax > 22 && city.happiness < 45) p -= p * 0.002 * dt;           // citizens leave over high taxes
  if (p > housingCap) p -= Math.min(p - housingCap, (p - housingCap) * 0.04 * dt + 0.05);
  city.population = Math.max(0, p);
  city.peakPop = Math.max(city.peakPop, city.population);
  S.meta.bestPop = Math.max(S.meta.bestPop, city.population);
  SIM.attract = A;

  // --- 16. Research ---------------------------------------------------------------
  let rp = 0;
  for (let i = 0; i < list.length; i++) { const b = list[i], d = BUILDINGS[b.type]; if (d.rp && b._op) rp += d.rp * lvlMult(b.level) * b._eff; }
  rp *= (hasTech('s_method') ? 1.15 : 1) * (hasTech('s_quantum') ? 1.3 : 1) * mods.rp;
  SIM.rpRate = rp;
  S.research.rp += rp * dt; S.research.total += rp * dt;

  // --- 17. Companies: XP / levels -----------------------------------------------------
  for (const cid in S.companies.list) {
    const c = S.companies.list[cid], cs = compStats[cid];
    if (cs.profit > 0) c.xp += cs.profit * dt;
    while (c.level < 10 && c.xp >= companyXpFor(c.level + 1)) {
      c.level++;
      const title = companyTitle(c.level);
      notify('🏢 ' + companyDef(cid).name + ' reached Level ' + c.level + ' — ' + title + '!', 'gold');
      flashBig(companyDef(cid).name + '<br>LEVEL ' + c.level);
      sfx('levelup');
      if (c.level === 3) notify('🔓 New exclusive building: ' + BUILDINGS[companyDef(cid).exclusive].name, 'gold');
    }
  }
}
function companyXpFor(L) { return 1500 * (Math.pow(3, L - 1) - 1) / 2; }
function companyTitle(L) { let t = COMPANY_TITLES[0][1]; COMPANY_TITLES.forEach(function (x) { if (L >= x[0]) t = x[1]; }); return t; }

/* Loan repayment (installments). Missed payments hurt credit score. */
function bankTick(dt) {
  const loans = S.bank.loans;
  for (let i = loans.length - 1; i >= 0; i--) {
    const l = loans[i];
    const pay = Math.min(l.perSec * dt, l.remaining);
    if (S.money >= pay) { S.money -= pay; l.remaining -= pay; }
    else { l.remaining *= 1.0005; S.bank.credit = Math.max(0, S.bank.credit - 0.15); }
    if (l.remaining <= 0.01) {
      loans.splice(i, 1); S.bank.repaid++; S.bank.credit = Math.min(100, S.bank.credit + 6);
      notify('🏦 Loan of ' + money(l.principal) + ' fully repaid! Credit score improved.', 'good');
      sfx('achievement');
    }
  }
}
function creditLimit() {
  let assets = 0; S.buildings.list.forEach(function (b) { if (b.built) assets += BUILDINGS[b.type].cost * lvlMult(b.level); });
  const debt = S.bank.loans.reduce(function (a, l) { return a + l.remaining; }, 0);
  return Math.max(0, (2000 + assets * 0.6 + Math.max(0, SIM.net) * 600) * (0.5 + S.bank.credit / 100) - debt);
}
function loanRate(o) { return Math.max(0.01, o.rate - (hasTech('b_finance') ? 0.01 : 0) + (S.bank.credit < 40 ? 0.03 : 0)); }
function takeLoan(k) {
  const o = LOAN_OFFERS[k];
  if (!o) return;
  if (S.bank.loans.length >= 5) { toast('❌ Too many active loans (max 5)', 'bad'); sfx('error'); return; }
  if (o.amt > creditLimit()) { toast('❌ Credit limit too low', 'bad'); sfx('error'); return; }
  const rate = loanRate(o);
  const total = o.amt * (1 + rate);
  S.bank.loans.push({ id: S.bank.nextId++, principal: o.amt, total: total, remaining: total, perSec: total / o.term, rate: rate });
  S.money += o.amt;
  toast('🏦 Loan approved: +' + money(o.amt) + ' (repay ' + money(total) + ')', 'gold');
  sfx('money');
}
function repayLoan(id) {
  const l = S.bank.loans.find(function (x) { return x.id === id; });
  if (!l) return;
  if (S.money < l.remaining) { toast('❌ Not enough money to repay', 'bad'); sfx('error'); return; }
  S.money -= l.remaining; l.remaining = 0; bankTick(0);
}

/* --- Stock market simulation (virtual, in-game only) ------------------------- */
function stockTick(dt) {
  const crash = !!activeEvent('crash');
  for (const cid in S.companies.list) {
    const c = S.companies.list[cid], cs = SIM.companies[cid] || { profit: 0, assets: 0 };
    const fundamental = Math.max(0.05, (Math.max(0, cs.profit) * 3600 + cs.assets * 0.5 + c.level * 50000) / SHARES_TOTAL * (crash ? 0.7 : 1));
    c.price = Math.max(0.1, c.price + (fundamental - c.price) * 0.03 * dt + c.price * gauss() * 0.012 * Math.sqrt(dt));
  }
  NPC_STOCKS.forEach(function (s) {
    const st = S.companies.stocks[s.id];
    const sec = s.link;
    const trend = SIM.saleMult[sec] !== undefined ? (SIM.saleMult[sec] - 1) * 0.0003 : 0;
    const target = s.base * (1 + Math.log10(1 + S.city.population) / 6);
    st.price = Math.max(0.5, st.price * (1 + gauss() * s.vol * 0.5 * Math.sqrt(dt) + trend * dt + (crash ? -0.003 * dt : 0)) + (target - st.price) * 0.006 * dt);
  });
}
function recordStockHistory() {
  for (const cid in S.companies.list) { const c = S.companies.list[cid]; c.hist.push(+c.price.toFixed(3)); if (c.hist.length > 120) c.hist.shift(); }
  NPC_STOCKS.forEach(function (s) { const st = S.companies.stocks[s.id]; st.hist.push(+st.price.toFixed(3)); if (st.hist.length > 120) st.hist.shift(); });
}
function foundCompany(id) {
  const cd = companyDef(id); if (!cd || S.companies.list[id]) return;
  const cost = Math.round(cd.cost * costMult());
  if (S.money < cost) { toast('❌ Not enough money', 'bad'); sfx('error'); return; }
  S.money -= cost;
  S.companies.list[id] = { level: 1, xp: 0, own: 1, price: 1, hist: [1], products: 0, founded: Date.now() };
  notify('🏢 ' + cd.name + ' founded! All ' + cd.sectors.join('/') + ' buildings now belong to it.', 'gold');
  flashBig(cd.icon + ' ' + cd.name);
  sfx('levelup');
}
function productCost(cd, k) { return Math.round(cd.cost * [2, 8, 30, 120][k] * costMult()); }
function launchProduct(id) {
  const cd = companyDef(id), c = S.companies.list[id]; if (!c) return;
  const k = c.products; if (k >= 4) return;
  if (c.level < PRODUCT_LEVELS[k]) { toast('Requires company Level ' + PRODUCT_LEVELS[k], 'bad'); sfx('error'); return; }
  const cost = productCost(cd, k);
  if (S.money < cost) { toast('❌ Not enough money', 'bad'); sfx('error'); return; }
  S.money -= cost; c.products++;
  notify('🚀 ' + cd.name + ' launched "' + cd.products[k] + '"! Revenue boosted.', 'gold');
  sfx('achievement');
}
function tradeOwnShares(id, sell) {
  const c = S.companies.list[id]; if (!c) return;
  const chunk = 0.05, val = c.price * SHARES_TOTAL * chunk;
  if (sell) {
    if (c.own - chunk < 0.5 - 1e-9) { toast('You must keep at least 51% control', 'bad'); sfx('error'); return; }
    c.own = +(c.own - chunk).toFixed(2); S.money += val * 0.98; c.price *= 0.985;
    toast('📉 Sold 5% of ' + companyDef(id).name + ' for ' + money(val * 0.98), 'gold'); sfx('money');
  } else {
    if (c.own >= 1) return;
    const cost = val * 1.02;
    if (S.money < cost) { toast('❌ Not enough money', 'bad'); sfx('error'); return; }
    S.money -= cost; c.own = Math.min(1, +(c.own + chunk).toFixed(2)); c.price *= 1.015;
    toast('📈 Bought back 5% of ' + companyDef(id).name, 'good'); sfx('money');
  }
}
function tradeStock(id, qty) {
  const st = S.companies.stocks[id]; if (!st) return;
  const pf = S.companies.portfolio[id] || { qty: 0, cost: 0 };
  if (qty > 0) {
    const cost = st.price * qty * 1.005;
    if (S.money < cost) { toast('❌ Not enough money', 'bad'); sfx('error'); return; }
    S.money -= cost; pf.qty += qty; pf.cost += cost;
    st.price *= 1 + 0.00002 * qty;
    sfx('money');
  } else {
    const q = Math.min(pf.qty, -qty); if (q <= 0) return;
    const val = st.price * q * 0.995;
    const basis = pf.qty > 0 ? pf.cost * q / pf.qty : 0;
    S.money += val; pf.qty -= q; pf.cost -= basis;
    S.companies.tradeProfit += val - basis;
    st.price *= 1 - 0.00002 * q;
    sfx('money');
  }
  if (pf.qty > 0) S.companies.portfolio[id] = pf; else delete S.companies.portfolio[id];
}
function portfolioValue() { let v = 0; for (const id in S.companies.portfolio) v += S.companies.portfolio[id].qty * S.companies.stocks[id].price; return v; }

/* --- Research ------------------------------------------------------------------ */
function techState(t) {
  if (hasTech(t.id)) return 'done';
  if (t.ng && S.meta.ngLevel < t.ng) return 'locked';
  return t.req.every(hasTech) ? 'avail' : 'locked';
}
function researchTech(id) {
  const t = TECHS[id]; if (!t) return;
  if (techState(t) !== 'avail') { toast('🔒 Prerequisites missing', 'bad'); sfx('error'); return; }
  if (S.research.rp < t.cost) { toast('❌ Not enough Research Points', 'bad'); sfx('error'); return; }
  S.research.rp -= t.cost;
  S.technology.unlocked.push(id);
  notify('🔬 Researched: ' + t.name + ' — ' + t.desc, 'good');
  sfx('levelup');
  onMapChanged();
}

/* --- Land expansion ---------------------------------------------------------------- */
function expansionCost() { return Math.round((EXPANSION_COSTS[S.city.expansion + 1] || Infinity) * costMult()); }
function expandLand() {
  if (S.city.expansion >= maxExpansionFor(MAP.W)) return;
  const c = expansionCost();
  if (S.money < c) { toast('❌ Not enough money', 'bad'); sfx('error'); return; }
  S.money -= c; S.city.expansion++;
  MAP.groundDirty = true;
  notify('🗺️ New land unlocked! The city can grow further.', 'gold');
  sfx('levelup'); shake(4);
}

/* --- Prestige 2.0 & New Game+ --------------------------------------------------------- */
function canPrestige() { return S.city.peakPop >= 10000 || S.statistics.run.revenue >= 25e6; }
function prestigeGain(ng) {
  const g = Math.floor(2 * Math.sqrt(S.statistics.run.revenue / 5e6) + S.city.peakPop / 5000);
  return ng ? Math.floor(g * 1.5) + 3 : g;
}
function canNewGamePlus() { return S.quests.mission >= MISSIONS.length; }
function doPrestige(ng) {
  if (ng ? !canNewGamePlus() : !canPrestige()) return;
  const gain = prestigeGain(ng);
  const meta = S.meta;
  meta.pp += gain; meta.prestigeCount++;
  if (ng) {
    meta.ngLevel++;
    if (meta.skins.indexOf('neon') < 0) meta.skins.push('neon');
  }
  const settings = S.settings, ach = S.achievements, totals = S.statistics.totals;
  S = defaultState(meta, settings, ach, totals);
  resetSim();
  S.tutorial.done = true;
  initMap(true); placeStarterCity(); onMapChanged(); resetAgents();
  CAM.x = MAP.W * TILE / 2; CAM.y = MAP.H * TILE / 2;
  selectBuilding(null); closeModal(); closeLeft();
  saveGame(true);
  flashBig(ng ? '♾️ NEW GAME+ ' + meta.ngLevel : '⭐ PRESTIGE!<br>+' + gain + ' PP');
  notify(ng ? '♾️ New Game+ started: bigger map, new tech, new landmark, harder economy.' : '⭐ Prestige complete! Spend PP on permanent upgrades.', 'gold');
  sfx('levelup');
}
function buyPPUpgrade(id) {
  const u = PRESTIGE_UPGRADES.find(function (x) { return x.id === id; });
  const lvl = ppLevel(id);
  if (lvl >= u.max) return;
  const cost = lvl + 1;
  if (S.meta.pp < cost) { toast('❌ Not enough PP', 'bad'); sfx('error'); return; }
  S.meta.pp -= cost; S.meta.ppUpgrades[id] = lvl + 1;
  sfx('achievement');
}

/* =============================== 6. EVENTS =============================== */
function constructionTick(dt) {
  const speed = 1;
  S.buildings.list.forEach(function (b) {
    const d = BUILDINGS[b.type];
    if (!b.built) {
      b.progress = Math.min(1, b.progress + dt * speed / b.buildTime);
      if (Math.random() < 0.5) { const c = buildingCenter(b); spawnParticles(c.x + rand(-10, 10), c.y + rand(-6, 6), Math.random() < 0.5 ? 'dust' : 'spark', 1); }
      if (b.progress >= 1) {
        b.built = true; b.progress = 1;
        S.statistics.totals.built++;
        const c = buildingCenter(b);
        spawnParticles(c.x, c.y - 10, 'confetti', 26);
        sfx('complete');
        if (d.landmark || d.id === 'airport') { shake(6); flashBig(d.icon + ' ' + d.name + '<br>COMPLETE!'); notify('🏆 ' + d.name + ' is complete!', 'gold'); }
        else if (d.cost >= 5000) notify('🏗️ ' + d.name + ' construction finished.', 'good');
        onMapChanged();
      }
    } else if (b.upg > 0) {
      b.upg = Math.min(1, b.upg + dt / b.upgTime);
      if (Math.random() < 0.4) { const c = buildingCenter(b); spawnParticles(c.x + rand(-8, 8), c.y - 12, 'spark', 1); }
      if (b.upg >= 1) {
        b.upg = 0; b.level = Math.min(MAX_LEVEL, b.level + 1);
        const c = buildingCenter(b); spawnParticles(c.x, c.y - 14, 'confetti', 18);
        sfx('complete'); toast('⬆️ ' + d.name + ' upgraded to Lv' + b.level, 'good');
        computeCoverage();
      }
    }
  });
}

function disasterMitigation() {
  return clamp(SIM.cov.fire * 0.4 + SIM.cov.health * 0.2 + (hasTech('d_fire') ? 0.2 : 0) + (hasTech('d_warning') ? 0.3 : 0), 0, 0.85);
}
function damageableBuildings() { return S.buildings.list.filter(function (b) { const d = BUILDINGS[b.type]; return b.built && !d.landmark && d.id !== 'tree' && d.id !== 'park' && !b.damaged; }); }
function damageBuilding(b) { b.damaged = 1; b.repair = b._cov && b._cov.fire ? 60 : 150; const c = buildingCenter(b); spawnParticles(c.x, c.y, 'smoke', 10); }
function igniteBuilding(b) {
  if (!b || b.fire > 0) return;
  b.fire = 30; b._truck = false;
  notify('🔥 Fire at ' + BUILDINGS[b.type].name + '!' + (b._cov && b._cov.fire ? ' Firefighters dispatched.' : ' No fire coverage!'), 'bad');
}
function startCrisis(c) {
  S.events.active.push({ kind: 'crisis', id: c.id, start: S.clock.runSec, ends: S.clock.runSec + c.dur });
  notify(c.icon + ' ' + c.name + ' — ' + c.desc + ' (' + Math.round(c.dur / 60) + ' min)', 'bad');
  flashBig(c.icon + ' ' + c.name); sfx('event');
}
function startDisaster(d) {
  const m = disasterMitigation();
  S.events.active.push({ kind: 'disaster', id: d.id, start: S.clock.runSec, ends: S.clock.runSec + d.dur });
  notify(d.icon + ' ' + d.name.toUpperCase() + '! ' + d.desc + ' Emergency services reduce damage (' + Math.round(m * 100) + '% mitigation).', 'bad');
  flashBig(d.icon + ' ' + d.name.toUpperCase()); sfx('event');
  const cand = damageableBuildings();

/* --- Citizens: utility-AI state machine ----------------------------------- */

  for (let i = 0; i < arr.length; i++) { r -= wfn(arr[i]); if (r <= 0) return arr[i]; }

function spawnCitizen(tourist) {

  const target = Math.min(maxN - touristTarget, Math.floor(S.city.population));

function removeOneCitizen(tourist) {

/* Utility-based decision making */
function decide(c) {

  if (c.tourist) {
    push('GO_RESTAURANT', (100 - c.needs.food) * 1.1, MAP.lists.FOOD);
    push('GO_ENTERTAINMENT', (100 - c.needs.fun) * 1.0 + 20, MAP.lists.ENTERTAINMENT.concat(MAP.lists.tourism));
    push('GO_SHOPPING', (100 - c.needs.shopping) * 0.9, MAP.lists.SHOPPING);
    push('GO_PARK', 35, MAP.lists.parks);
    push('GO_HOME_SLEEP', night ? 100 : 0, null);
  } else {

    if (c.work) push('GO_WORK', (h >= 6.5 && h < 16 && c.lastWorkDay !== today) ? 82 + (c.money < 100 ? 20 : 0) : 0, null);
    else push('FIND_WORK', (c.money < 100 && h >= 7 && h < 16) ? 78 : (h >= 8 && h < 15 ? 25 : 0), MAP.lists.jobs, function (b) { return b.workers > 0 && BUILDINGS[b.type].sector !== 'HOUSING'; });
    if (c.money >= 12) push('GO_RESTAURANT', (100 - c.needs.food) * 1.1 + (c.needs.food < 30 ? 40 : 0) + ((h >= 12 && h < 14) || (h >= 19 && h < 21) ? 25 : 0), MAP.lists.FOOD);
    if (c.money >= 15) push('GO_ENTERTAINMENT', (100 - c.needs.fun) * 0.9 + (c.needs.fun < 30 ? 30 : 0) + (h >= 18 && h < 23 ? 25 : 0), MAP.lists.ENTERTAINMENT);
    if (c.money >= 20) push('GO_SHOPPING', (100 - c.needs.shopping) * 0.7 + (h >= 11 && h < 18 ? 15 : 0), MAP.lists.SHOPPING);
    push('GO_PARK', (100 - c.needs.fun) * 0.6 + (h >= 9 && h < 20 ? 10 : 0), MAP.lists.parks);

    const o = opts[k];

    else if (o.state === 'GO_WORK') target = citizenBuilding(c.work);
    else if (o.state === 'IDLE') target = null;
    else target = nearestOf(o.list || [], c.x, c.y, o.filter);
    if (o.state !== 'IDLE' && (!target || !target._op && o.state !== 'GO_HOME' && o.state !== 'GO_HOME_SLEEP')) continue;
    if (o.state === 'FIND_WORK') { c.work = target.id; c.state = 'GO_WORK'; }

/* --- Weather ------------------------------------------------------------------ */
function updateWeather(dt) {
  const storm = activeEvent('storm');
  let w = FX.weather;
  if (storm) w = 'storm';
  else if (S.clock.gameSec >= FX.weatherUntil || w === 'storm') {
    const season = currentSeason().id;
    const r = Math.random();
    w = season === 'winter' ? (r < 0.45 ? 'snow' : 'clear') : (r < (season === 'autumn' ? 0.35 : season === 'summer' ? 0.12 : 0.25) ? 'rain' : 'clear');
    FX.weatherUntil = S.clock.gameSec + rand(2, 5) * 3600;
  }
  if (w !== FX.weather) { FX.weather = w; FX.drops = []; if (w !== 'clear') sfx('weather'); }
  const want = FX.weather === 'clear' ? 0 : Math.floor((FX.weather === 'snow' ? 140 : FX.weather === 'storm' ? 320 : 200) * perf().weather * PERF.scale);
  while (FX.drops.length < want) FX.drops.push({ x: Math.random() * CW, y: Math.random() * CH, s: rand(0.6, 1.2), o: Math.random() * 6 });
  if (FX.drops.length > want) FX.drops.length = want;
  const snow = FX.weather === 'snow';
  const vy = snow ? 40 : (FX.weather === 'storm' ? 700 : 500), vx = snow ? 0 : (FX.weather === 'storm' ? -220 : -80);
  FX.drops.forEach(function (d) {
    d.y += vy * d.s * dt; d.x += (vx + (snow ? Math.sin(FX.time + d.o) * 20 : 0)) * d.s * dt;
    if (d.y > CH) { d.y = -10; d.x = Math.random() * (CW + 200); }
    if (d.x < -20) d.x = CW + 10;

  if (FX.weather === 'storm' && Math.random() < dt * 0.25) { FX.flash = 1; shake(3); sfx('thunder'); }

}

/* --- Heat-map overlays ---------------------------------------------------------- */
function computeHeat(mode) {
  const N = MAP.W * MAP.H;
  if (!heat.grid || heat.grid.length !== N) heat.grid = new Float32Array(N);
  const g = heat.grid; g.fill(0);
  if (mode === 'POLLUTION') {
    S.buildings.list.forEach(function (b) {
      const d = BUILDINGS[b.type]; if (!b.built || !d.pol) return;
      const c = buildingCenter(b), R = 6;
      const v = d.pol * lvlMult(b.level) * (d.pol > 0 ? Math.max(0.3, b._eff) : 1);
      const cx = c.x / TILE, cy = c.y / TILE;
      for (let y = Math.floor(cy - R); y <= cy + R; y++) for (let x = Math.floor(cx - R); x <= cx + R; x++) {
        if (!inMap(x, y)) continue;
        const dd = Math.hypot(x + 0.5 - cx, y + 0.5 - cy); if (dd > R) continue;
        g[idx(x, y)] += v * (1 - dd / R) * 0.12;
      }
    });
    for (let i = 0; i < N; i++) if (MAP.roads[i]) g[i] += SIM.traffic / 250;
    // Parks & trees clean the air around them
    S.buildings.list.forEach(function (b) { const d = BUILDINGS[b.type]; if (!b.built || d.pol >= 0) return; const c = buildingCenter(b); const cx = Math.floor(c.x / TILE), cy = Math.floor(c.y / TILE); for (let y = cy - 2; y <= cy + 2; y++) for (let x = cx - 2; x <= cx + 2; x++) if (inMap(x, y)) g[idx(x, y)] = Math.max(0, g[idx(x, y)] + d.pol * 0.05 * (hasTech('env_green') ? 2 : 1)); });
    let mx = 0; for (let i = 0; i < N; i++) if (g[i] > mx) mx = g[i];
    const k = Math.max(1, mx) * (1.2 - S.city.pollution / 100);
    for (let i = 0; i < N; i++) g[i] = g[i] / k;
  } else if (mode === 'FIRE' || mode === 'POLICE' || mode === 'HEALTH') {
    const t = mode === 'FIRE' ? 'fire' : mode === 'POLICE' ? 'police' : 'health';
    MAP.lists[t].forEach(function (s) {
      if (!s.built || !s._road) return;
      const c = buildingCenter(s), R = coverRadius(s), cx = c.x / TILE, cy = c.y / TILE;
      for (let y = Math.floor(cy - R); y <= cy + R; y++) for (let x = Math.floor(cx - R); x <= cx + R; x++) {
        if (!inMap(x, y)) continue;
        const dd = Math.hypot(x + 0.5 - cx, y + 0.5 - cy); if (dd <= R) g[idx(x, y)] = Math.max(g[idx(x, y)], 1 - dd / R * 0.5);
      }
    });
  }
  heat.at = FX.time; heat.mode = mode;
}
function drawOverlay(v) {

  if (mode === 'POWER') {
    S.buildings.list.forEach(function (b) {
      const d = BUILDINGS[b.type]; if (!b.built) return;
      ctx.fillStyle = d.power > 0 ? 'rgba(255,209,102,.55)' : (d.power < 0 ? (b._powered ? 'rgba(6,214,160,.45)' : 'rgba(239,71,111,.6)') : 'rgba(0,0,0,0)');

  }

    const px = UI.ghost ? UI.ghost.x : hv.x - Math.floor((d.w - 1) / 2), py = UI.ghost ? UI.ghost.y : hv.y - Math.floor((d.h - 1) / 2);

    ctx.strokeStyle = chk.ok ? '#06d6a0' : '#ef476f'; ctx.lineWidth = 2 / CAM.zoom; ctx.strokeRect(px * TILE, py * TILE, d.w * TILE, d.h * TILE);
    ctx.globalAlpha = 0.9; drawEmoji(d.icon, (px + d.w / 2) * TILE, (py + d.h / 2) * TILE, Math.min(d.w, d.h) * 18); ctx.globalAlpha = 1;
    if (d.cover) { ctx.strokeStyle = 'rgba(6,214,160,.7)'; ctx.beginPath(); ctx.arc((px + d.w / 2) * TILE, (py + d.h / 2) * TILE, d.cover * (hasTech('d_emergency') ? 1.3 : 1) * TILE, 0, 6.283); ctx.stroke(); }
  }
  if (UI.tool === 'road' && hv) {
    const tiles = UI.roadDrag ? lineTiles(UI.roadDrag.x0, UI.roadDrag.y0, UI.roadDrag.x1, UI.roadDrag.y1) : [[hv.x, hv.y]];
    tiles.forEach(function (t) { ctx.fillStyle = canRoad(t[0], t[1]) ? 'rgba(76,201,240,.45)' : (isRoad(t[0], t[1]) ? 'rgba(255,255,255,.12)' : 'rgba(239,71,111,.4)'); ctx.fillRect(t[0] * TILE, t[1] * TILE, TILE, TILE); });
  }
  if (UI.tool === 'bulldoze' && hv) {
    const bb = buildingAtTile(hv.x, hv.y);
    if (bb) { const d = BUILDINGS[bb.type]; ctx.fillStyle = 'rgba(239,71,111,.4)'; ctx.fillRect(bb.x * TILE, bb.y * TILE, d.w * TILE, d.h * TILE); }
    else { ctx.fillStyle = 'rgba(239,71,111,.35)'; ctx.fillRect(hv.x * TILE, hv.y * TILE, TILE, TILE); }
  }
}

/* --- Toasts, notifications, flashes ------------------------------------------------ */
function toast(msg, cls) {
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (cls || '');
  el.textContent = msg;
  box.appendChild(el);
  while (box.children.length > 4) box.removeChild(box.firstChild);
  setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 320); }, 2600);
}
function notify(msg, cls) {
  UI.notifs.unshift({ msg: msg, cls: cls || '', t: pad2(Math.floor(gameHour())) + ':' + pad2(Math.floor((S.clock.gameSec / 60) % 60)) + ' D' + gameDay() });
  if (UI.notifs.length > 80) UI.notifs.pop();
  if (UI.rtab !== 'notifs' || UI.rightCollapsed) UI.unread++;
  toast(msg, cls);
  if (cls !== 'bad') sfx('notify');
  if (UI.rtab === 'notifs') renderRight();
  updateBadge();
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }

}

function drawChart(cv, data, color) {
  const r = cv.getBoundingClientRect();
  const w = Math.max(50, r.width), h = Math.max(40, r.height);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1;
  for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(0, h * i / 4); c.lineTo(w, h * i / 4); c.stroke(); }
  if (!data || data.length < 2) { c.fillStyle = '#6f76a8'; c.font = '11px sans-serif'; c.fillText('Collecting data…', 8, h / 2); return; }
  let mn = Infinity, mx = -Infinity;
  data.forEach(function (v) { mn = Math.min(mn, v); mx = Math.max(mx, v); });
  if (mx - mn < 1e-6) { mx += 1; mn -= 1; }
  const pad = 14;
  const X = function (i) { return i / (data.length - 1) * (w - 4) + 2; };
  const Y = function (v) { return h - pad - (v - mn) / (mx - mn) * (h - pad * 2); };
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, color + '66'); g.addColorStop(1, color + '00');
  c.beginPath(); c.moveTo(X(0), h); data.forEach(function (v, i) { c.lineTo(X(i), Y(v)); }); c.lineTo(X(data.length - 1), h); c.closePath(); c.fillStyle = g; c.fill();
  c.beginPath(); data.forEach(function (v, i) { if (i) c.lineTo(X(i), Y(v)); else c.moveTo(X(i), Y(v)); }); c.strokeStyle = color; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#a3a9d6'; c.font = '10px sans-serif';
  c.fillText(fmt(mx, mx < 10 ? 2 : undefined), 4, 10); c.fillText(fmt(mn, mn < 10 ? 2 : undefined), 4, h - 3);
  c.fillStyle = color; c.textAlign = 'right'; c.fillText(fmt(data[data.length - 1], data[data.length - 1] < 10 ? 2 : undefined), w - 4, 10); c.textAlign = 'left';
}

function drawInterior(cv, b, t) {
  const r = cv.getBoundingClientRect();

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (cv.width !== Math.floor(W * dpr)) { cv.width = W * dpr; cv.height = H * dpr; }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const d = BUILDINGS[b.type], type = interiorType(d);
  const staff = Math.min(10, Math.max(b.workers ? 1 : 0, Math.round(b._actW / Math.max(1, d.workers) * 6)));
  const cust = Math.min(12, Math.round(Math.sqrt(b._cust || 0)));

  c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(0, 0, W, 16);
  const eff = b._eff || 0;
  if (type === 'bank') {
    c.fillStyle = '#6b4f3a'; c.fillRect(W * 0.1, H * 0.3, W * 0.55, 16);
    for (let i = 0; i < Math.min(5, staff); i++) person(W * 0.14 + i * W * 0.11, H * 0.24, '#1d3557');
    const vx = W * 0.83, vy = H * 0.4;
    c.fillStyle = '#6c757d'; c.beginPath(); c.arc(vx, vy, 30, 0, 6.283); c.fill(); c.fillStyle = '#adb5bd'; c.beginPath(); c.arc(vx, vy, 24, 0, 6.283); c.fill();
    c.strokeStyle = '#343a40'; c.lineWidth = 3; for (let k = 0; k < 3; k++) { const a = t * 0.8 + k * 2.09; c.beginPath(); c.moveTo(vx, vy); c.lineTo(vx + Math.cos(a) * 18, vy + Math.sin(a) * 18); c.stroke(); }
    c.fillStyle = '#ffd166'; for (let k = 0; k < Math.min(8, Math.log10(1 + (b.vault || 0)) * 1.5); k++) c.fillRect(vx - 28 + (k % 4) * 14, vy + 40 + Math.floor(k / 4) * 7, 12, 5);
    person(W * 0.06, H * 0.8, '#212529'); c.fillStyle = '#fff'; c.font = '9px sans-serif'; c.fillText('GUARD', W * 0.02, H * 0.95);
    for (let i = 0; i < cust; i++) { const ph = (t * 0.15 + i / Math.max(1, cust)) % 1; person(W * 0.1 + ph * W * 0.5, H * 0.62 + (i % 2) * 14, CITIZEN_COLORS[i % 10]); }
  } else if (type === 'factory') {
    const by = H * 0.5;
    c.fillStyle = '#343a40'; c.fillRect(10, by, W - 20, 14);
    c.fillStyle = '#495057'; for (let x = 10 + ((t * 40 * eff) % 16); x < W - 10; x += 16) c.fillRect(x, by + 2, 2, 10);
    for (let k = 0; k < 6; k++) { const x = 10 + ((t * 40 * eff + k * (W / 6)) % (W - 30)); c.fillStyle = '#c9a26b'; c.fillRect(x, by - 10, 12, 10); c.strokeStyle = '#8a6d45'; c.strokeRect(x, by - 10, 12, 10); }
    for (let k = 0; k < 3; k++) { const mx = W * (0.2 + k * 0.25); c.fillStyle = '#6c757d'; c.fillRect(mx - 18, by - 46, 36, 30); c.fillStyle = Math.floor(t * 3 + k) % 2 && eff > 0 ? '#06d6a0' : '#ef476f'; c.fillRect(mx - 12, by - 40, 6, 6); c.fillStyle = '#ffd166'; c.fillRect(mx + 4, by - 40, 8, 4); }
    for (let i = 0; i < staff; i++) person(W * (0.12 + (i % 5) * 0.18) + Math.sin(t * 2 + i) * 4, by + 36 + Math.floor(i / 5) * 22, '#f8961e');
    const share = SIM.goodsProd > 0 ? (b._prod || 0) / SIM.goodsProd : 0, cap = d.goods * lvlMult(b.level) * 60;
    const fill = cap ? clamp((SIM.goodsStock || 0) * share / cap, 0, 1) : 0;
    c.fillStyle = '#212529'; c.fillRect(W - 44, 22, 34, H * 0.35);
    for (let k = 0; k < Math.round(fill * 8); k++) { c.fillStyle = '#c9a26b'; c.fillRect(W - 40 + (k % 2) * 15, 22 + H * 0.35 - 10 - Math.floor(k / 2) * 11, 12, 9); }
    c.fillStyle = '#fff'; c.font = '9px sans-serif'; c.fillText('STORAGE', W - 48, 18);
  } else if (type === 'restaurant') {
    c.fillStyle = '#dee2e6'; c.fillRect(10, 20, W - 20, 24); c.fillStyle = '#adb5bd'; for (let k = 0; k < 4; k++) c.fillRect(24 + k * 40, 24, 26, 14);
    for (let i = 0; i < Math.min(3, staff); i++) person(30 + i * 40, 58, '#ffffff');
    const tables = 6;

    }
    for (let i = 3; i < staff; i++) { const ph = (t * 0.25 + i * 0.3) % 1; const f = ph < 0.5 ? ph * 2 : 2 - ph * 2; person(W * 0.1 + f * W * 0.8, H * 0.45 + (i % 2) * 40, '#212529'); }
  } else if (type === 'home') {
    c.fillStyle = '#8d99ae'; c.fillRect(20, 30, 60, 30); c.fillStyle = '#e63946'; c.fillRect(W - 90, 30, 70, 40);
    c.fillStyle = '#2b2d42'; c.fillRect(W / 2 - 30, 26, 60, 6);

  } else {
    for (let k = 0; k < 8; k++) {
      const dx = W * (0.12 + (k % 4) * 0.22), dy = H * (0.35 + Math.floor(k / 4) * 0.35);

}

const SND = {
  ctx: null, master: null, rainGain: null, rainSrc: null, musicTimer: null, last: {},
  init: function () {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  tone: function (freq, dur, type, vol, delay, slide) {
    if (!this.ctx) return;
